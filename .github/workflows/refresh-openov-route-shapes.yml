name: Refresh OpenOV route shapes in Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-openov-route-shapes.yml"
      - "scripts/build-openov-trip-shapes.py"
      - "scripts/openov-trip-shapes-selftest.py"
      - "src/openov-shapes-assets.ts"
      - "wrangler.openov-shapes.toml"
  schedule:
    # Run late in the evening; if OpenOV is late, the previous shapes remain live.
    - cron: "35 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openov-trip-shapes-refresh
  cancel-in-progress: false

jobs:
  validate-builder:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public OVLive repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate synthetic GTFS route-shape builder
        run: python3 scripts/openov-trip-shapes-selftest.py
      - name: Validate static Worker asset deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/openov-trip-shapes
          printf '%s\n' '{"format":1,"precision":5,"routes":{"123":["route-123-0.json"]},"routeCount":1,"tripCount":1,"shapeCount":1}' > public/openov-trip-shapes/manifest.json
          printf '%s\n' '{"format":1,"routeId":"123","precision":5,"trips":{"456":"shape-1"},"shapes":{"shape-1":"_p~iF~ps|U_ulLnnqC"}}' > public/openov-trip-shapes/route-123-0.json
          npx wrangler deploy --dry-run --config wrangler.openov-shapes.toml
          rm -rf public/openov-trip-shapes

  refresh-and-publish:
    if: github.repository == 'strongo01/ovlive' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout public OVLive repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing."
            echo "Create a Cloudflare API token with Workers Scripts: Edit permission."
            exit 1
          }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || {
            echo "::error::Repository secret CLOUDFLARE_ACCOUNT_ID is missing."
            exit 1
          }

      - name: Download current OpenOV GTFS and build exact route shapes
        run: |
          set -euo pipefail
          python3 scripts/build-openov-trip-shapes.py --refresh
          python3 scripts/openov-trip-shapes-selftest.py
          test -s public/openov-trip-shapes/manifest.json
          count="$(find public/openov-trip-shapes -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$count" -le 20000 || {
            echo "::error::OpenOV geometry asset count is $count; Workers Free has a per-version asset limit."
            exit 1
          }
          oversized="$(find public/openov-trip-shapes -maxdepth 1 -type f -size +25M -print)"
          test -z "$oversized" || {
            echo "::error::At least one OpenOV geometry file exceeds 25 MiB."
            printf '%s\n' "$oversized"
            exit 1
          }
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("public/openov-trip-shapes")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          routes = manifest.get("routes")
          if manifest.get("format") != 1 or not isinstance(routes, dict) or not routes:
              raise SystemExit("Invalid or empty OpenOV geometry manifest")
          missing = [name for names in routes.values() for name in names if not (root / name).is_file()]
          if missing:
              raise SystemExit("Missing route-shape shard(s): " + ", ".join(missing[:10]))
          print(json.dumps({
              "generatedAt": manifest.get("generatedAt"),
              "source": manifest.get("source"),
              "routeCount": len(routes),
              "tripCount": manifest.get("tripCount"),
              "shapeCount": manifest.get("shapeCount"),
              "fileCount": sum(1 for p in root.iterdir() if p.is_file()),
              "sizeMiB": round(sum(p.stat().st_size for p in root.iterdir() if p.is_file()) / 1024 / 1024, 1)
          }, indent=2))
          PY

      - name: Publish the complete geometry dataset as a separate Cloudflare Worker
        run: npx wrangler deploy --config wrangler.openov-shapes.toml

      - name: Summary
        run: |
          echo "New OpenOV route shapes deployed to the separate static Worker."
          echo "No R2 bucket or Cloudflare payment details are required."
