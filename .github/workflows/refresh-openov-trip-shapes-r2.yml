name: Refresh OpenOV trip shapes in Cloudflare R2

on:
  schedule:
    # OpenOV normally publishes the new static GTFS feed in the evening.
    # Run later in the UTC day to avoid publishing yesterday's timetable.
    - cron: "35 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openov-trip-shapes-r2
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    if: github.repository == 'strongo01/ovlive'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ovlive-openov-trip-shapes
      VERSION_PREFIX: versions/${{ github.run_id }}-${{ github.run_attempt }}/

    steps:
      - name: Checkout public OVLive repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Wrangler
        run: npm ci

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || {
            echo "::error::Repository secret CLOUDFLARE_ACCOUNT_ID is missing."
            exit 1
          }

      - name: Create R2 bucket if needed
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler r2 bucket list | grep -Fq "$R2_BUCKET"; then
            echo "R2 bucket exists: $R2_BUCKET"
          else
            npx wrangler r2 bucket create "$R2_BUCKET"
          fi

      - name: Keep only 14 days of versioned files
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler r2 bucket lifecycle list "$R2_BUCKET" | grep -Fq "expire-openov-shape-versions"; then
            echo "Version-retention rule already exists."
          else
            npx wrangler r2 bucket lifecycle add "$R2_BUCKET" expire-openov-shape-versions versions/ --expire-days 14 --force
          fi

      - name: Download current OpenOV GTFS and build exact route shapes
        run: |
          set -euo pipefail
          python3 scripts/build-openov-trip-shapes.py --refresh
          python3 scripts/openov-trip-shapes-selftest.py
          test -s public/openov-trip-shapes/manifest.json
          test "$(find public/openov-trip-shapes -maxdepth 1 -type f -name 'route-*.json' | wc -l | tr -d ' ')" -gt 0

      - name: Prepare versioned manifest
        shell: bash
        run: |
          set -euo pipefail
          tmp="public/openov-trip-shapes/manifest.r2.json"
          jq --arg prefix "$VERSION_PREFIX" '. + {objectPrefix: $prefix}' \
            public/openov-trip-shapes/manifest.json > "$tmp"
          mv "$tmp" public/openov-trip-shapes/manifest.json
          jq '{generatedAt, source, routeCount, tripCount, shapeCount, shardCount: (.routes | to_entries | map(.value | length) | add), objectPrefix}' \
            public/openov-trip-shapes/manifest.json

      - name: Upload new versioned route shards
        shell: bash
        run: |
          set -euo pipefail
          export R2_BUCKET VERSION_PREFIX
          find public/openov-trip-shapes -maxdepth 1 -type f -name 'route-*.json' -print0 |
            xargs -0 -r -n 1 -P 6 bash -c '
              set -euo pipefail
              file="$1"
              key="${R2_BUCKET}/${VERSION_PREFIX}$(basename "$file")"
              npx wrangler --log-level error r2 object put "$key" --file "$file" --remote --force
            ' _
          echo "All shards uploaded to ${R2_BUCKET}/${VERSION_PREFIX}"

      - name: Publish manifest last
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler --log-level error r2 object put \
            "$R2_BUCKET/manifest.json" \
            --file public/openov-trip-shapes/manifest.json \
            --remote --force
          echo "Published manifest.json; the Worker can now use the complete new version."
