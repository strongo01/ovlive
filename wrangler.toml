name = "ovlive-realtime"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
APP_NAME = "OVLive"
APP_VERSION = "0.3.0-ovapi-crossmatch-test"
# Set this to a contact email or website before using Transitous in production.
APP_CONTACT = "newstapper@outlook.com"
# TEMPORARY CONTROLLED NDOV SOAK TEST
NDOV_AUTOCOLLECT = "true"

# Publieke API-bescherming. Browser-ID-limieten verbeteren eerlijk delen van een IP;
# ruimere IP-limieten blijven als extra vangnet tegen misbruik bestaan.
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "202610140001"

  [ratelimits.simple]
  limit = 1200
  period = 60

[[ratelimits]]
name = "PLAN_RATE_LIMITER"
namespace_id = "202610140002"

  [ratelimits.simple]
  limit = 200
  period = 60

[[ratelimits]]
name = "DEVICE_API_RATE_LIMITER"
namespace_id = "202610210003"

  [ratelimits.simple]
  limit = 300
  period = 60

[[ratelimits]]
name = "DEVICE_PLAN_RATE_LIMITER"
namespace_id = "202610210004"

  [ratelimits.simple]
  limit = 50
  period = 60

# Lokale NDOV-diagnosebridge. Deze endpoints accepteren alleen loopback-hosts.
[[durable_objects.bindings]]
name = "NDOV_FEEDS"
class_name = "NdovFeedHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NdovFeedHub"]

[[r2_buckets]]
binding = "OPENOV_SHAPES"
bucket_name = "ovlive-openov-trip-shapes"

[triggers]
crons = ["*/5 * * * *"]
